version: '3.8'

services:
  health-monitor-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: health-monitor
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Inject environment variables from your local .env file
      - NODE_ENV=development
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules # Prevents local node_modules from overwriting the container's isolated ones
      # Mount AWS credentials so the container can authenticate with DynamoDB & SecretsManager
      - ~/.aws:/root/.aws:ro
    command: node server.js
