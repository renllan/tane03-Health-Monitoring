name: Build Docker Image (CI)

on:
  push:
    branches:
      - '**'        # all branches
      - '!main'     # except main — handled by deploy.yaml

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -f docker/Dockerfile -t tane03/health-model-api:ci .
          echo "✅ Build succeeded for branch: ${{ github.ref_name }}"
