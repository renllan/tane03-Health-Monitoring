name: Build and Push to ECR

on:
  push:
    branches:
      - main
  

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-northeast-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
    
    - name: Ensure ECR Repository exists
      run: |
        aws ecr describe-repositories --repository-names tane03/health-model-api

    - name: build and push to ecr

      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        # Updated to match your actual repository name
        ECR_REPOSITORY: tane03/health-model-api
        IMAGE_TAG: ${{ github.sha }}
        
      run: |
        # Build the container
        docker build -f docker/Dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        # Push to ECR with the Git SHA tag
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        
        # Also tag as 'latest' so you always have a stable reference
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

    - name: Deploy to Lambda
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: tane03/health-model-api
        IMAGE_TAG: ${{ github.sha }}

      run: |
        aws lambda update-function-code \
          --function-name tane03-long-term-health-monitoring \
          --image-uri $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
          --region ap-northeast-1
          



        # Wait for the update to finish
        aws lambda wait function-updated \
          --function-name tane03-long-term-health-monitoring \
          --region ap-northeast-1

          
        aws lambda update-function-configuration \
          --function-name tane03-long-term-health-monitoring \
          --region ap-northeast-1 \
          --environment "Variables={
            DEVICE_INFO_TABLE=${{ secrets.DEVICE_INFO_TABLE }},
            HEALTH_DATA_TABLE=${{ secrets.HEALTH_DATA_TABLE }},
            AAASWatch_BASE_URL=${{ secrets.AAASWatch_BASE_URL }},
            US_REGION=us-east-1,
            AP_NORTHEAST_REGION=ap-northeast-1,
            SLEEP_LAMBDA_NAME=${{ secrets.SLEEP_LAMBDA_NAME }}, 
            TANE03_SLEEP_TABLE=${{ secrets.TANE03_SLEEP_TABLE }},
            HEALTH_BASELINE_TABLE=${{ secrets.HEALTH_BASELINE_TABLE }},
            TANE03_HRV_TABLE=${{ secrets.TANE03_HRV_TABLE }},
            SCHEDULER_ROLE_ARN=${{ secrets.SCHEDULER_ROLE_ARN }},
            DAILY_EVALUATION_TABLE=${{ secrets.DAILY_EVALUATION_TABLE }},
            HEALTH_MONITORING_LAMBDA_ARN=${{ secrets.HEALTH_MONITORING_LAMBDA_ARN }},
            USE_COGNITO=false,
            COGNITO_USER_POOL_ID=${{ secrets.COGNITO_USER_POOL_ID }},
            COGNITO_CLIENT_ID=${{ secrets.COGNITO_CLIENT_ID }}
          }"

      
    - name: Check api health
      env:
        BASE_URL: ${{ secrets.BASE_URL }}
      run: |
        curl $BASE_URL/api/health


